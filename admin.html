
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EarnNova Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#fff;font-family:Arial,sans-serif;padding:20px}
.container{max-width:650px;margin:auto}
h1{color:#54e6a1}
.card{background:#151d32;padding:20px;border-radius:16px;margin:18px 0;border:1px solid #293650}
input,textarea,select{width:100%;padding:14px;margin:8px 0 15px;background:#0b1020;color:white;border:1px solid #394761;border-radius:9px;font-size:15px}
button{padding:13px 18px;border:0;border-radius:9px;background:#19b879;color:#06140e;font-weight:bold;cursor:pointer;margin:5px}
.delete{background:#e64c62;color:white}
.edit{background:#4269d9;color:white}
.logout{background:#e64c62;color:white}
small{color:#9baac3}
.item{padding:15px;border:1px solid #394761;border-radius:12px;margin:12px 0;overflow-wrap:anywhere}
.item img{width:100%;max-height:160px;object-fit:cover;border-radius:8px}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
<h1>EarnNova ⚡</h1>
<p>Admin Dashboard</p>

<div class="card" id="loginBox">
<h2>Admin Login 🔐</h2>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="loginMsg"></p>
</div>

<div id="dashboard" class="hidden">
<div class="card">
<h2>Dashboard</h2>
<p>Welcome to EarnNova Admin Panel</p>
<button class="logout" onclick="logout()">Logout</button>
</div>

<div class="card">
<h2 id="formTitle">Add New Listing +</h2>
<input id="name" placeholder="Listing Name">
<select id="category">
<option value="Daily Income">Daily Income</option>
<option value="Free Earning">Free Earning</option>
<option value="Referral Earn">Referral Earn</option>
<option value="Other">Other</option>
</select>
<textarea id="description" placeholder="Description"></textarea>
<input id="link" type="url" placeholder="Website / Telegram Link">
<input id="image" type="url" placeholder="Image URL">
<button onclick="saveListing()">Save Listing</button>
<button class="edit" onclick="resetForm()">Clear Form</button>
<p id="message"></p>
</div>

<div class="card">
<h2>Manage Listings</h2>
<button onclick="loadListings()">Refresh</button>
<div id="listings">Loading...</div>
</div>
</div>
</div>

<script>
const SUPABASE_URL = "https://dambwmaukouhqnagnpci.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_yl01Xo92CY1horXk6Gojpg_mwIdzdQO";

const db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

let editingId = null;

function safe(value){
return String(value || "").replace(/[&<>"']/g, c => ({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"
}[c]));
}

async function login(){
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const msg=document.getElementById("loginMsg");

msg.textContent="Checking login...";

const {error}=await db.auth.signInWithPassword({
email,password
});

if(error){
msg.textContent=error.message;
return;
}

showDashboard();
}

function showDashboard(){
document.getElementById("loginBox").classList.add("hidden");
document.getElementById("dashboard").classList.remove("hidden");
loadListings();
}

async function logout(){
await db.auth.signOut();
location.reload();
}

async function saveListing(){
const name=document.getElementById("name").value.trim();
const category=document.getElementById("category").value;
const description=document.getElementById("description").value.trim();
const link=document.getElementById("link").value.trim();
const image_url=document.getElementById("image").value.trim();
const message=document.getElementById("message");

if(!name || !link){
message.textContent="Name and Link are required.";
return;
}

if(!/^https?:\/\//i.test(link) ||
(image_url && !/^https?:\/\//i.test(image_url))){
message.textContent="Please enter valid HTTP/HTTPS links.";
return;
}

const data={name,category,description,link,image_url};
message.textContent="Saving...";

let result;

if(editingId){
result=await db.from("listings")
.update(data).eq("id",editingId);
}else{
result=await db.from("listings").insert(data);
}

if(result.error){
message.textContent="Error: "+result.error.message;
return;
}

message.textContent="Successfully saved!";
resetForm();
loadListings();
}


async function loadListings(){
  const box = document.getElementById("listings");
  box.textContent = "Loading...";

  try {
    const { data, error } = await db
      .from("listings")
      .select("*");

    if(error){
      box.textContent = "Database Error: " + error.message;
      return;
    }

    if(!data || data.length === 0){
      box.textContent = "No listings added yet.";
      return;
    }

    box.innerHTML = data.map(item => `
      <div class="item">
        <h3>${safe(item.name)}</h3>
        <p>${safe(item.category)}</p>
        <p>${safe(item.description)}</p>
        ${item.image_url ? `<img src="${safe(item.image_url)}" alt="Listing image">` : ""}
        <p><a href="${safe(item.link)}" target="_blank" rel="noopener noreferrer">Open Link</a></p>
        <button class="edit" onclick="editListing('${safe(item.id)}')">Edit</button>
        <button class="delete" onclick="deleteListing('${safe(item.id)}')">Delete</button>
      </div>
    `).join("");

  } catch(err) {
    box.textContent = "Error: " + err.message;
  }
}


async function editListing(id){
const {data,error}=await db.from("listings")
.select("*").eq("id",id).single();

if(error){
alert(error.message);
return;
}

editingId=data.id;
document.getElementById("name").value=data.name || "";
document.getElementById("category").value=data.category || "Other";
document.getElementById("description").value=data.description || "";
document.getElementById("link").value=data.link || "";
document.getElementById("image").value=data.image_url || "";
document.getElementById("formTitle").textContent="Edit Listing";
window.scrollTo({top:0,behavior:"smooth"});
}

async function deleteListing(id){
if(!confirm("Are you sure you want to delete this listing?"))return;

const {error}=await db.from("listings")
.delete().eq("id",id);

if(error){
alert(error.message);
return;
}

alert("Listing deleted!");
loadListings();
}

function resetForm(){
editingId=null;
["name","description","link","image"].forEach(id=>{
document.getElementById(id).value="";
});
document.getElementById("category").value="Daily Income";
document.getElementById("formTitle").textContent="Add New Listing +";
}

db.auth.getSession().then(({data})=>{
if(data.session)showDashboard();
});
</script>
</body>
</html>
